name: Update ticker

on:
  schedule:
    # Weekdays 14:15 UTC = 9:15am ET / 7:15am MT in winter (8:15am MT in summer).
    # Lands after the 8:30am ET BLS releases (CPI, jobs report) post to FRED.
    - cron: "15 14 * * 1-5"
  workflow_dispatch: # "Run workflow" button for manual refreshes

permissions:
  contents: write

concurrency:
  group: ticker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::fredr
            any::httr2
            any::jsonlite
            any::dplyr

      - name: Build ticker.json
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: Rscript R/build_ticker.R

      - name: Commit if numbers changed
        run: |
          git config user.name "better&bad ticker bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ticker.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Ticker update $(date -u +%F)"
            git push
          fi
